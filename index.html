<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <!-- >>> Per app: set the description + <title> to this app. -->
    <meta name="description" content="A login and registration demo with security you can watch: passwords are salted and key-stretched with 120,000 SHA-256 iterations in your browser, and never stored in recoverable form." />

    <!-- Set the theme class before first paint so there's no flash of the wrong
         theme. Dark-first, matching the portfolio; localStorage key 'theme'. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme')
          var theme = stored || 'dark'
          document.documentElement.classList.add(theme)
        } catch (e) {
          document.documentElement.classList.add('dark')
        }
      })()
    </script>

    <!-- Fonts: Fraunces (display serif), Inter (body/UI), JetBrains Mono (structure/code) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Instant splash: paint the black (or paper) background before the JS
         bundle loads, so there's no white/black flash. React clears #root on mount. -->
    <style>
      html { background: #000000; }
      body {
        margin: 0;
        min-height: 100vh;
        color: #eae7df;
        background: transparent;
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, sans-serif;
      }
      html.light { background: #f4f2ea; }
      .light body { color: #1c1a15; }
      #app-splash { position: fixed; inset: 0; display: grid; place-items: center; z-index: 9999; }
      #app-splash .ring {
        width: 44px; height: 44px; border-radius: 50%;
        border: 2px solid rgba(234, 231, 223, 0.12);
        border-top-color: #4d9bf2; border-right-color: #5a86ef;
        animation: splash-spin 0.85s linear infinite;
      }
      @keyframes splash-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #app-splash .ring { animation: none; } }
    </style>

    <title>Login &amp; Registration</title>
  </head>
  <body>
    <div id="root">
      <div id="app-splash" aria-hidden="true"><div class="ring"></div></div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
